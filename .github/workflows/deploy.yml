name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install & Build
        run: |
          corepack prepare --activate
          yarn install --immutable
          yarn build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Three cache tiers, split by mutually exclusive --include patterns so each file is
      # uploaded (and considered for --delete) by exactly one of the three passes:
      #   1. _astro/* is content-hashed (the filename changes with the content), so it can
      #      cache forever.
      #   2. Everything else under public/ (assets/*: images, fonts, icons) is NOT hashed,
      #      so a replaced file must reach visitors within a bounded time; no `immutable`.
      #   3. HTML and the other unhashed, revisited-on-every-load files (manifest, sitemaps,
      #      robots.txt, llms.txt, an rss/sw.js if either is ever added) must always
      #      revalidate.
      - name: Sync static assets to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_SITE_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "_astro/*"
          aws s3 sync dist/ "s3://${{ secrets.AWS_SITE_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=43200" \
            --exclude "*" --include "assets/*"
          aws s3 sync dist/ "s3://${{ secrets.AWS_SITE_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html" --include "manifest.json" --include "sitemap*.xml" \
            --include "robots.txt" --include "llms.txt" --include "sw.js" --include "rss*.xml"
